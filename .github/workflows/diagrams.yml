name: Render diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/*.d2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install d2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Render .d2 sources to .svg
        run: |
          for f in docs/diagrams/*.d2; do
            d2 "$f" "${f%.d2}.svg"
          done

      - name: Commit rendered SVGs
        run: |
          if [[ -n $(git status --porcelain docs/diagrams) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/diagrams/*.svg
            git commit -m "chore: render D2 diagrams"
            git push
          else
            echo "No diagram changes to commit"
          fi
