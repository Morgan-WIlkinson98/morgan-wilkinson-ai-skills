name: Check diagrams

on:
  pull_request:
    paths:
      - 'docs/diagrams/**'
  push:
    branches: [main, dev]
    paths:
      - 'docs/diagrams/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  D2_VERSION: v0.9.0
  D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install d2 ${{ env.D2_VERSION }}
        run: |
          archive="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/${archive}"
          echo "${D2_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          sudo install "d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version

      - name: Render .d2 sources to .svg
        run: |
          for f in docs/diagrams/*.d2; do
            d2 "$f" "${f%.d2}.svg"
          done

      - name: Fail if committed SVGs are out of date
        run: |
          if [[ -n $(git status --porcelain docs/diagrams) ]]; then
            git status --porcelain docs/diagrams
            echo "::error::Rendered SVGs do not match their .d2 sources. Run: for f in docs/diagrams/*.d2; do d2 \"\$f\" \"\${f%.d2}.svg\"; done — with d2 ${D2_VERSION} — and commit the .svg files."
            exit 1
          fi
          echo "All diagrams are up to date"
